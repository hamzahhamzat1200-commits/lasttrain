name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get repository files
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src

      - name: Check game.html
        run: |
          cd src
          test -s game.html || { echo "game.html is missing"; exit 1; }
          head -c 200 game.html | grep -qi '<!doctype html' || { echo "game.html has no doctype - upload the newest game.html"; exit 1; }
          grep -q 'name="viewport"' game.html || { echo "game.html has no viewport - upload the newest game.html"; exit 1; }

      - name: Set up Java and Android SDK
        run: |
          JH="${JAVA_HOME_17_X64:-}"
          if [ -z "$JH" ]; then JH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"; fi
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          export JAVA_HOME="$JH"
          java -version
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM" || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        run: |
          curl -fsSL --retry 5 --retry-delay 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Create the Android project
        run: |
          mkdir -p P/app/src/main/assets P/app/src/main/java/com/lasttrain/game
          cp src/game.html P/app/src/main/assets/index.html
          cd P
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "android.useAndroidX=false" >> gradle.properties
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'LastTrain'
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.lasttrain.game'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lasttrain.game'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="آخر قطار"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/lasttrain/game/MainActivity.java <<'EOT'
          package com.lasttrain.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView web;
              private TextToSpeech tts;
              private boolean ttsOk = false;

              private void jsDone() {
                  runOnUiThread(new Runnable() {
                      @Override public void run() {
                          if (web != null) web.evaluateJavascript("window.__ttsDone&&window.__ttsDone()", null);
                      }
                  });
              }

              private class Bridge {
                  @JavascriptInterface public boolean ready() { return ttsOk; }
                  @JavascriptInterface public void speak(String text) {
                      if (tts != null && ttsOk) tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "lt");
                  }
                  @JavascriptInterface public void stop() { if (tts != null) tts.stop(); }
                  @JavascriptInterface public void quit() { runOnUiThread(new Runnable() { @Override public void run() { finishAffinity(); } }); }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#060d19"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override public void onInit(int status) {
                          if (status != TextToSpeech.SUCCESS) return;
                          int r = tts.setLanguage(new Locale("ar"));
                          if (r < TextToSpeech.LANG_AVAILABLE) return;
                          tts.setSpeechRate(0.85f);
                          tts.setPitch(0.8f);
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) { }
                              @Override public void onDone(String id) { jsDone(); }
                              @Override public void onError(String id) { jsDone(); }
                          });
                          ttsOk = true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
                  immersive();
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
              @Override protected void onPause() { super.onPause(); web.onPause(); if (tts != null) tts.stop(); }
              @Override protected void onDestroy() { if (tts != null) { tts.shutdown(); } super.onDestroy(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOT

      - name: Add launcher icon
        run: |
          mkdir -p P/app/src/main/res
          cp -r src/store/res/* P/app/src/main/res/
          sed -i 's/android:label="آخر قطار"/android:label="آخر قطار" android:icon="@mipmap\/ic_launcher"/' P/app/src/main/AndroidManifest.xml
          grep -c ic_launcher P/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd P
          gradle assembleDebug --no-daemon --stacktrace
          ls -l app/build/outputs/apk/debug/

      - name: Build developer APK
        run: |
          cp P/app/build/outputs/apk/debug/app-debug.apk LastTrain.apk
          if [ -s src/game-dev.html ]; then
            cp src/game-dev.html P/app/src/main/assets/index.html
            sed -i "s/applicationId 'com.lasttrain.game'/applicationId 'com.lasttrain.dev'/" P/app/build.gradle
            sed -i 's/android:label="آخر قطار"/android:label="آخر قطار DEV"/' P/app/src/main/AndroidManifest.xml
            cd P && gradle assembleDebug --no-daemon --stacktrace && cd ..
            cp P/app/build/outputs/apk/debug/app-debug.apk LastTrain-Dev.apk
          fi

      - name: Build signed AAB for Google Play
        env:
          KS_B64: ${{ secrets.UPLOAD_KS_B64 }}
          KS_PW: ${{ secrets.UPLOAD_KS_PW }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing secrets - skipping AAB"; exit 0; fi
          SDK="$ANDROID_HOME"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"; test -x "$SM" || SM="$(command -v sdkmanager)"
          "$SM" "platforms;android-36" "build-tools;35.0.0" || true
          curl -fsSL --retry 5 -o gradle2.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle2.zip
          rm -rf P2 && mkdir P2 && cp -r P/app P/settings.gradle P/gradle.properties P/local.properties P2/
          rm -rf P2/app/build
          cp src/game.html P2/app/src/main/assets/index.html
          sed -i "s/applicationId 'com.lasttrain.dev'/applicationId 'com.lasttrain.game'/" P2/app/build.gradle
          sed -i 's/android:label="آخر قطار DEV"/android:label="آخر قطار"/' P2/app/src/main/AndroidManifest.xml
          echo "$KS_B64" | base64 -d > P2/upload.jks
          cd P2
          echo "plugins { id 'com.android.application' version '8.9.1' apply false }" > build.gradle
          sed -i "s/compileSdk 34/compileSdk 36/; s/targetSdk 34/targetSdk 36/; s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          cat >> app/build.gradle <<EOT
          android {
              signingConfigs { release { storeFile file('../upload.jks'); storePassword System.getenv('KS_PW'); keyAlias 'upload'; keyPassword System.getenv('KS_PW') } }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOT
          ../gradle-8.11.1/bin/gradle bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../LastTrain.aab
          ls -l ../LastTrain.aab

      - name: Publish APK as a release
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" LastTrain.apk $(test -s LastTrain-Dev.apk && echo LastTrain-Dev.apk) $(test -s LastTrain.aab && echo LastTrain.aab) --repo "$GITHUB_REPOSITORY" --title "LastTrain APK #${GITHUB_RUN_NUMBER}" --notes "Download LastTrain.apk and install it on your phone."
